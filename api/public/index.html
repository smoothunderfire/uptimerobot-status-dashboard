<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status</title>
</head>

<body>

    <h1>System Status</h1>

    <p>UptimeRobot Status Dashboard</p>

    <p id="status">Testing API...</p>

    <script>
        fetch("/api/status")
            .then(response => response.json())
            .then(data => {
                document.getElementById("status").innerText =
                    "API connection successful.";
                console.log(data);
            })
            .catch(error => {
                document.getElementById("status").innerText =
                    "API connection failed.";
                console.error(error);
            });
    </script>

</body>
</html>
